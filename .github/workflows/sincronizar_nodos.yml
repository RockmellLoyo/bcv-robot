name: SINCRONIZAR TASAS
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 2-6' # 10 PM hora Venezuela

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: node --no-warnings sync_nodes.js
